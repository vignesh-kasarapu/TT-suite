name: release

# D-083/D-092: authored now, dormant — gated on manual dispatch + an `environment`
# approval so it cannot fire on a normal push. OIDC federated credentials to ACR
# (no stored secret) once a remote + Azure app registration exist (stage 11).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [test, prod]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name acrapp
      - run: docker build -t acrapp.azurecr.io/app/app:${{ github.sha }} -f Solution/Dockerfile .
      - run: docker push acrapp.azurecr.io/app/app:${{ github.sha }}
      - name: Deploy
        run: pwsh Solution/infra/deploy.ps1 -Env ${{ github.event.inputs.environment }} -ImageTag ${{ github.sha }}
