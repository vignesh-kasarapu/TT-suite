name: ci

# Entry point. The jobs live in their own files:
#   backend-tests.yml   the six backends' tests against PostgreSQL
#   build-package.yml   the five frontends + the deployable dist-suite package
#   e2e-tests.yml       that package started for real, tested in a browser (Playwright)
# The same pipeline on your machine: npm run ci:local
# The repository holds every part (portal, Kanban, LMS, EMS, AMS): nothing else to check out.
on:
  push:
    branches: [main, master, with-resume, without-resume]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  # SUITE_SKIP for this branch: '' = every app; 'resume' = without the Resume Evaluator
  # (the without-resume branch). The build leaves those apps out and e2e tests what is left.
  build-package:
    uses: ./.github/workflows/build-package.yml
    with:
      suite-skip: ''

  e2e-tests:
    needs: build-package
    uses: ./.github/workflows/e2e-tests.yml
    with:
      package-artifact: dist-suite-${{ github.sha }}
      suite-skip: ''
