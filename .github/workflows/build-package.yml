name: build-package

# Build the five frontends (the portal's includes its TypeScript check) and assemble the one
# deployable folder, dist-suite/ (deploy/build.mjs). The folder is kept as a workflow artifact,
# ready for Azure or an organisation server (README, sections 4 and 5).
on:
  workflow_call:
    inputs:
      suite-skip:
        description: Apps to leave out (SUITE_SKIP), e.g. resume
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUITE_SKIP: ${{ inputs.suite-skip }}
    steps:
      - uses: actions/checkout@v7

      # Kanban's package.json requires Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            portal/frontend/package-lock.json
            Kanban-internal-main/package-lock.json
            lms-2.0-main/lms-2.0-main/frontend/package-lock.json
            ems/frontend/package-lock.json
            asset-manager/frontend/package-lock.json
            ResumeEvaluator-main/frontend/package-lock.json

      # Kanban installs from its workspace root (frontend + tests share one lockfile).
      - name: Install frontend packages
        run: |
          skip=",$(echo "$SUITE_SKIP" | tr -d ' ' | tr 'A-Z' 'a-z'),"
          for entry in portal:portal/frontend kanban:Kanban-internal-main lms:lms-2.0-main/lms-2.0-main/frontend \
                       expense:ems/frontend ams:asset-manager/frontend resume:ResumeEvaluator-main/frontend; do
            app="${entry%%:*}"; dir="${entry#*:}"
            case "$skip" in *",$app,"*) echo "skipping $app (SUITE_SKIP)"; continue ;; esac
            echo "::group::npm ci ($dir)"
            (cd "$dir" && npm ci --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Build and package
        run: node deploy/build.mjs --skip-install

      - uses: actions/upload-artifact@v7
        with:
          name: dist-suite-${{ github.sha }}
          path: dist-suite/
          retention-days: 14
