name: Set up one backend
description: Python 3.13 with one backend's requirements and the shared suite_core library.

inputs:
  working-directory:
    description: The backend folder, relative to the suite root.
    required: true
  requirements:
    description: Requirements file inside that folder (empty = none, e.g. for suite_core itself).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: |
          ${{ inputs.working-directory }}/requirements*.txt
          packages/suite_core/pyproject.toml

    - name: Install requirements
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$REQUIREMENTS" ]; then pip install -r "$REQUIREMENTS"; fi
        pip install -e "$GITHUB_WORKSPACE/packages/suite_core" pytest
