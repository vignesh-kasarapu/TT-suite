name: Check out the three apps
description: >
  Clone Kanban, LMS and EMS into the folders the suite expects (see README, "Get the code").
  The suite repository itself must already be checked out.

inputs:
  token:
    description: Token that can read the three app repositories (a PAT when they are private).
    required: true
  kanban-repo:
    description: owner/name of the Kanban repository
    required: true
  kanban-ref:
    description: Branch, tag or commit of Kanban
    required: false
    default: main
  lms-repo:
    description: owner/name of the LMS repository
    required: true
  lms-ref:
    description: Branch, tag or commit of LMS
    required: false
    default: srikaran-py-port
  ems-repo:
    description: owner/name of the EMS repository
    required: true
  ems-ref:
    description: Branch, tag or commit of EMS (empty = its default branch)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check the app repositories are configured
      shell: bash
      env:
        EMS_REPO: ${{ inputs.ems-repo }}
      run: |
        if [ -z "$EMS_REPO" ]; then
          echo "::error::Set the repository variable EMS_REPO (owner/name of the EMS repository): Settings -> Secrets and variables -> Actions -> Variables."
          exit 1
        fi

    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.kanban-repo }}
        ref: ${{ inputs.kanban-ref }}
        token: ${{ inputs.token }}
        path: Kanban-internal-main

    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.lms-repo }}
        ref: ${{ inputs.lms-ref }}
        token: ${{ inputs.token }}
        path: lms-2.0-main/lms-2.0-main

    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.ems-repo }}
        ref: ${{ inputs.ems-ref }}
        token: ${{ inputs.token }}
        path: ems
