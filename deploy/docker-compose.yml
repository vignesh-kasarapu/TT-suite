# Local Postgres for the TT Suite (one database, schemas: public=Kanban, suite, lms, expense).
# Mirrors Azure: an owner role runs migrations, the runtime role (app_rw) only does DML.
# Port 5433 so it never clashes with a separately running Kanban stack on 5432.
name: ttsuite
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ttsuite
    ports:
      - "5433:5432"
    volumes:
      - ttsuite_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ttsuite"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ttsuite_pgdata:
