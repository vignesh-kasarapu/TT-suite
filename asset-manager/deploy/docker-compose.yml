# Production stack for running the pre-built image on any Docker host.
# Needs only this file + .env on the target machine (no source code).
#
#   docker load -i ams-app.tar      # or: docker pull <registry>/ams-app:<tag>
#   docker compose up -d
#
# App: http://localhost:${APP_PORT:-8080}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ams_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ams_user} -d ${POSTGRES_DB:-ams_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${AMS_IMAGE:-ams-app:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ams_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ams_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
